version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ucon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ucon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ucon_secret_change_me}
      POSTGRES_DB: ${DB_NAME:-ucon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ucon} -d ${DB_NAME:-ucon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ucon_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-ucon}
      DB_PASSWORD: ${DB_PASSWORD:-ucon_secret_change_me}
      DB_NAME: ${DB_NAME:-ucon_db}
      JWT_SECRET: ${JWT_SECRET:-ucon_jwt_super_secret_change_in_production}
      PORT: ${PORT:-8080}
      STATIC_DIR: /app/static
    volumes:
      - ./backend/static:/app/static:ro
    ports:
      - "8080:8080"

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: ucon_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
